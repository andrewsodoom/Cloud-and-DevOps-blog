x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:8
    container_name: cloudcraft-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcraft-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: ${DOCKER_CLIENT_ORIGIN:-${PUBLIC_SITE_URL:-http://localhost:8080}}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      MONGODB_URI: mongodb://mongo:27017/cloudcraft
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-cloudcraft_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${PUBLIC_SITE_URL:-http://localhost:8080}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/server/uploads
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then((res) => { if (!res.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    container_name: cloudcraft-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: cloudcraft-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

volumes:
  mongo-data:
  uploads:
  caddy-data:
  caddy-config:
